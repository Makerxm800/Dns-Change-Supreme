appId: com.dnschangerpro.app
productName: DNS Changer Pro
copyright: Copyright © 2026 DNS Changer Pro
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - build/icon.png
  - build/tray-icon.png
  - public/icon.png
  - package.json
asar: true
asarUnpack:
  - build/**
win:
  icon: build/icon.png
  requestedExecutionLevel: asInvoker
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: DNS-Changer-Pro-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DNS Changer Pro
portable:
  artifactName: DNS-Changer-Pro-Portable-${version}-${arch}.exe
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  darkModeSupport: true
  identity: null
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  sign: false
  title: DNS Changer Pro ${version}
  artifactName: DNS-Changer-Pro-${version}-${arch}.dmg
publish:
  provider: github
  owner: Makerxm800
  repo: Dns-Changer-Pro
