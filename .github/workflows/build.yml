name: Build & Release Windows (.exe) and macOS (.dmg)

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Windows NSIS & Portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build macOS APP, ZIP & DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --mac zip --x64 --arm64 --publish never
          if ! npx electron-builder --mac dmg --x64 --arm64 --publish never; then
            echo "Falling back to native hdiutil DMG packaging..."
            VERSION=$(node -p "require('./package.json').version")
            if [ -d "release/mac-arm64/DNS Changer Pro.app" ]; then
              hdiutil create -volname "DNS Changer Pro" -srcfolder "release/mac-arm64/DNS Changer Pro.app" -ov -format UDZO "release/DNS-Changer-Pro-${VERSION}-arm64.dmg"
            fi
            if [ -d "release/mac/DNS Changer Pro.app" ]; then
              hdiutil create -volname "DNS Changer Pro" -srcfolder "release/mac/DNS Changer Pro.app" -ov -format UDZO "release/DNS-Changer-Pro-${VERSION}-x64.dmg"
            fi
          fi
          ls -lh release/
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml

  publish-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect Release Assets
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.blockmap" -o -name "*.yml" \) -exec cp -v {} release-files/ \;
          ls -lh release-files/
      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" release-files/* \
              --target "${{ github.sha }}" \
              --title "DNS Changer Pro ${TAG}" \
              --notes "Automated release of **DNS Changer Pro ${TAG}** for Windows (\`.exe\` Setup + Portable) and macOS (\`.dmg\` + \`.zip\` for Apple Silicon & Intel)."
          fi
